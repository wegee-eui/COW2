<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C.O.W</title>
  <style>
    /* Physical 35% rebuild: no page-level scale/zoom. Dimensions are actual CSS pixels. */
    :root {
      --ink: #000;
      --paper: #fff;
      --control: #d9d9d9;
      --accent: #ff5900;
      --page-pad: clamp(7px, 1.4vw, 27px);
      font-family: Inter, Geist, Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    img { display: block; }
    button, input { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .view { display: none; }
    .view.is-active { display: block; }

    /* Home: original 1920px design rebuilt at 35% actual CSS size (672px). */
    .home-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    .home-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 672px;
      overflow: visible;
      background: var(--paper);
    }

    .product-list {
      width: 672px;
      padding-top: 31px;
      padding-bottom: 52px;
    }

    .product-slot {
      position: relative;
      width: 672px;
      height: 184px;
      overflow: visible;
    }

    /* Preserve the original first-screen spacing from Figma. */
    .product-slot:nth-child(2) { height: 183px; }
    .product-slot:nth-child(5) { height: 184px; }

    .load-sentinel {
      width: 100%;
      height: 1px;
      pointer-events: none;
    }

    /*
       Every product uses one shared square visual canvas.
       Incoming GIF assets are standardized to 1500 x 1500px, while the
       on-page display box is rebuilt at the smaller physical size without page scaling.
       The idle cylinder and hover GIF share the exact same center and box,
       so nothing can drift sideways when hover state changes.
    */
    .product {
      --visual-size: 224px;
      position: absolute;
      top: 0;
      left: 50%;
      width: var(--visual-size);
      height: var(--visual-size);
      padding: 0;
      border: 0;
      overflow: visible;
      background: transparent;
      cursor: pointer;
      z-index: 2;
      transform: translateX(-50%);
      transform-origin: center top;
      -webkit-tap-highlight-color: transparent;
    }

    .product:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 1px;
      z-index: 20;
    }

    .default-cylinder,
    .hover-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none;
      transform-origin: center center;
      transition: opacity 90ms linear;
    }

    .default-cylinder {
      object-fit: contain;
      object-position: center center;
    }

    .hover-frame {
      overflow: visible;
      background: transparent;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .hover-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: center center;
      transform: none;
      transform-origin: center center;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .product:hover { z-index: 20; }
      .product:hover .default-cylinder { opacity: 0; }
      .product:hover .hover-frame {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
    }

    .product:focus-visible .default-cylinder { opacity: 0; }
    .product:focus-visible .hover-frame {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    @media (hover: none), (pointer: coarse) {
      .product.is-touch-preview { z-index: 20; }
      .product.is-touch-preview .default-cylinder { opacity: 0; }
      .product.is-touch-preview .hover-frame {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
    }

    /* ID card keeps the original Figma overlay position to the right.
       Its coordinates are rebuilt at the same 35% physical size as the home canvas. */
    .info-card {
      position: absolute;
      width: 238px;
      height: 176px;
      padding: 0;
      border: 1px solid var(--ink);
      border-radius: 9px;
      overflow: hidden;
      background: var(--paper);
      z-index: 100;
      display: none;
    }

    .info-card.is-open { display: block; }

    .info-copy {
      position: absolute;
      left: 16px;
      top: 15px;
      margin: 0;
      font-size: 12px;
      line-height: normal;
      font-weight: 400;
      white-space: pre-line;
    }

    .copyright {
      position: absolute;
      left: 14px;
      top: 160px;
      margin: 0;
      font-size: 7px;
      line-height: normal;
      white-space: nowrap;
    }

    .buy-button {
      position: absolute;
      left: 187px;
      top: 144px;
      width: 39px;
      height: 23px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: var(--control);
      color: var(--ink);
      font-size: 12px;
      line-height: 23px;
      text-align: center;
      cursor: pointer;
      transition: background 100ms linear, color 100ms linear, transform 100ms ease;
    }

    .buy-button:hover,
    .buy-button:focus-visible {
      outline: none;
      background: var(--accent);
      color: var(--paper);
    }

    .buy-button:active { transform: scale(0.98); }

    .home-footer {
      position: relative;
      width: 672px;
      height: 74px;
      background: var(--paper);
    }

    .brand-link {
      position: absolute;
      left: 26px;
      top: 43px;
      color: var(--ink);
      font-size: 11px;
      line-height: 1;
      text-decoration-line: underline;
      text-decoration-style: wavy;
      text-decoration-thickness: 1px;
      text-underline-offset: 1px;
      white-space: nowrap;
    }

    /* Checkout ----------------------------------------------------------- */
    .checkout-stage {
      min-height: 35svh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }

    .checkout-main {
      width: min(560px, 35vw);
      margin: 0 auto;
      padding: clamp(39px, 3.5vh, 60px) var(--page-pad) 20px;
      display: grid;
      grid-template-columns: minmax(105px, 210px) minmax(147px, 242px);
      justify-content: space-between;
      align-items: center;
      gap: clamp(17px, 2.8vw, 56px);
      flex: 1;
    }

    .checkout-back {
      position: fixed;
      left: var(--page-pad);
      top: clamp(10px, 2.1vh, 27px);
      z-index: 5;
      border: 0;
      padding: 0;
      background: transparent;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }

    .checkout-image-wrap {
      width: min(210px, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .checkout-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .checkout-form {
      width: 100%;
      display: grid;
      gap: 21px;
    }

    .checkout-row {
      width: 100%;
      min-height: 15px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      align-items: center;
      gap: 21px;
    }

    .checkout-row label {
      font-size: clamp(10px, 0.735vw, 12px);
      line-height: 1.2;
      white-space: nowrap;
    }

    .checkout-row input {
      width: 100%;
      height: 15px;
      border: 0;
      border-radius: 0;
      background: var(--control);
      padding: 1px 4px;
      color: var(--ink);
      outline: none;
      appearance: none;
    }

    .checkout-row input:focus { box-shadow: inset 0 0 0 1px var(--ink); }

    .checkout-submit {
      justify-self: end;
      width: min(105px, 100%);
      height: 30px;
      margin-top: 8px;
      border: 0;
      background: var(--control);
      cursor: pointer;
    }

    .checkout-submit:hover,
    .checkout-submit:focus-visible { outline: 1px solid var(--ink); }

    .checkout-footer {
      position: relative;
      height: 74px;
      flex: 0 0 74px;
      background: var(--paper);
    }

    .checkout-footer .brand-link {
      left: var(--page-pad);
      top: auto;
      bottom: 17px;
      font-size: clamp(7px, 0.595vw, 11px);
    }

    @media (max-width: 1180px) {
      .checkout-main {
        grid-template-columns: minmax(98px, 0.8fr) minmax(137px, 1fr);
        gap: clamp(13px, 1.75vw, 25px);
      }
      .checkout-row { gap: 10px; }
    }

    @media (max-width: 820px) {
      .checkout-main {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 19px;
        padding-top: 36px;
      }
      .checkout-image-wrap { width: min(196px, 29.4vw); }
      .checkout-form { width: min(242px, 100%); gap: 12px; }
      .checkout-row { grid-template-columns: 53px minmax(0, 1fr); gap: 8px; }
      .checkout-submit { margin-top: 3px; }
    }

    @media (max-width: 560px) {
      .checkout-image-wrap { width: min(151px, 30.8vw); }
      .checkout-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
      .checkout-row label { font-size: 9px; }
      .checkout-row input { height: 16px; }
      .checkout-submit { width: 100%; }
      .checkout-footer { height: 53px; flex-basis: 53px; }
      .checkout-footer .brand-link { bottom: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .product,
      .default-cylinder,
      .hover-frame,
      .hover-preview,
      .buy-button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section id="homeView" class="view is-active" aria-label="C.O.W home">
      <div id="homeShell" class="home-shell">
        <div id="homeStage" class="home-stage">
          <div id="productList" class="product-list"></div>
          <div id="loadSentinel" class="load-sentinel" aria-hidden="true"></div>

          <aside id="infoCard" class="info-card" role="dialog" aria-modal="false" aria-labelledby="infoText">
            <p id="infoText" class="info-copy"></p>
            <p id="copyright" class="copyright"></p>
            <button id="buyButton" class="buy-button" type="button">BUY</button>
          </aside>

          <footer class="home-footer">
            <a class="brand-link" href="https://www.google.com/search?tbm=isch&q=can+of+worms" target="_blank" rel="noopener noreferrer">@ C.O.W</a>
          </footer>
        </div>
      </div>
    </section>

    <section id="checkoutView" class="view" aria-label="Checkout">
      <div class="checkout-stage">
        <button id="backButton" class="checkout-back" type="button" aria-label="Back to home">←</button>

        <div class="checkout-main">
          <div class="checkout-image-wrap">
            <img class="checkout-image" src="https://www.figma.com/api/mcp/asset/893cc43e-0562-4c34-8fa5-54fd5c4753a6.png" alt="Selected C.O.W clipart" decoding="async" />
          </div>

          <form class="checkout-form" onsubmit="return false;">
            <div class="checkout-row"><label for="checkout1">Checkout</label><input id="checkout1" aria-label="Checkout field 1" /></div>
            <div class="checkout-row"><label for="checkout2">Checkout</label><input id="checkout2" aria-label="Checkout field 2" /></div>
            <div class="checkout-row"><label for="checkout3">Checkout</label><input id="checkout3" aria-label="Checkout field 3" /></div>
            <div class="checkout-row"><label for="checkout4">Checkout</label><input id="checkout4" aria-label="Checkout field 4" /></div>
            <div class="checkout-row"><label for="checkout5">Checkout</label><input id="checkout5" aria-label="Checkout field 5" /></div>
            <button class="checkout-submit" type="submit" aria-label="Complete checkout"></button>
          </form>
        </div>

        <footer class="checkout-footer">
          <a class="brand-link" href="https://www.google.com/search?tbm=isch&q=can+of+worms" target="_blank" rel="noopener noreferrer">@ C.O.W</a>
        </footer>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const DESIGN = Object.freeze({ width: 672, productX: 284, footerHeight: 74 });
      const GIF_SOURCE_SIZE = 1500;
      const MAX_PRODUCTS = 50;
      const INITIAL_BATCH = 8;
      const LOAD_BATCH = 5;
      const CYLINDER = 'https://www.figma.com/api/mcp/asset/239f8fc6-5e5e-454d-a654-c74e255d6127.svg';
      const ASSET_PATH = './ASSET/';

      const productTemplates = Object.freeze([
        { id: '#442733', owner: '© 2026 HWAIN JI. ALL RIGHT RESERVED', overlayX: 132, overlayY: 30 },
        { id: '#29838',  owner: '© 2026 Wegee. ALL RIGHT RESERVED',    overlayX: 120, overlayY: 43 },
        { id: '#98706',  owner: '© 2026 Subin Lee ALL RIGHT RESERVED', overlayX: 118, overlayY: 48 },
        { id: '#37957',  owner: '© 2026 Seunghun Shin ALL RIGHT RESERVED', overlayX: 116, overlayY: 37 },
        { id: '#49472',  owner: '© 2026 Sujung Jo ALL RIGHT RESERVED', overlayX: 116, overlayY: 42 },
        { id: '#48592',  owner: '© 2026 Jeyoon Lee ALL RIGHT RESERVED', overlayX: 117, overlayY: 7 }
      ]);
      const TEMPLATE_COUNT = productTemplates.length;

      const byId = (id) => document.getElementById(id);
      const homeView = byId('homeView');
      const checkoutView = byId('checkoutView');
      const homeShell = byId('homeShell');
      const homeStage = byId('homeStage');
      const productList = byId('productList');
      const loadSentinel = byId('loadSentinel');
      const infoCard = byId('infoCard');
      const infoText = byId('infoText');
      const copyright = byId('copyright');
      const buyButton = byId('buyButton');
      const backButton = byId('backButton');

      let selectedTrigger = null;
      let touchPreviewButton = null;
      let renderedCount = 0;
      let scaleFrame = 0;
      let loadObserver = null;

      const productAt = (index) => productTemplates[index % TEMPLATE_COUNT];
      const gifNameAt = (index) => String(index + 1).padStart(2, '0') + '.gif';

      function productMarkup(index) {
        const item = productAt(index);
        return `
          <div class="product-slot">
            <button
              class="product"
              type="button"
              aria-label="Clipart ${item.id.slice(1)}, item ${index + 1}"
              data-product="${index}"
            >
              <img class="default-cylinder" alt="" src="${CYLINDER}" decoding="async" />
              <span class="hover-frame" aria-hidden="true">
                <img
                  class="hover-preview"
                  alt=""
                  src="${ASSET_PATH}${gifNameAt(index)}"
                  width="${GIF_SOURCE_SIZE}"
                  height="${GIF_SOURCE_SIZE}"
                  loading="lazy"
                  decoding="async"
                />
              </span>
            </button>
          </div>
        `;
      }

      function scheduleHomeLayout() {
        if (scaleFrame) return;
        scaleFrame = requestAnimationFrame(() => {
          scaleFrame = 0;
          updateHomeLayout();
        });
      }

      function flushHomeLayout() {
        if (scaleFrame) {
          cancelAnimationFrame(scaleFrame);
          scaleFrame = 0;
        }
        updateHomeLayout();
      }

      function renderMore(count = LOAD_BATCH) {
        if (renderedCount >= MAX_PRODUCTS) return;

        const nextCount = Math.min(MAX_PRODUCTS, renderedCount + count);
        let markup = '';

        for (let index = renderedCount; index < nextCount; index += 1) {
          markup += productMarkup(index);
        }

        productList.insertAdjacentHTML('beforeend', markup);
        renderedCount = nextCount;
        loadSentinel.hidden = renderedCount >= MAX_PRODUCTS;
        scheduleHomeLayout();

        if (renderedCount >= MAX_PRODUCTS && loadObserver) {
          loadObserver.disconnect();
        }
      }

      function positionInfoCard(index, trigger) {
        const item = productAt(index);
        const slot = trigger.closest('.product-slot');
        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const compactViewport = viewportWidth < DESIGN.width;

        // On narrow viewports, keep the card centered on the visible page.
        // On wider viewports, preserve the original Figma relationship to the cylinder.
        infoCard.style.left = compactViewport ? '50%' : `${DESIGN.productX + item.overlayX}px`;
        infoCard.style.transform = compactViewport ? 'translateX(-50%)' : 'none';
        infoCard.style.top = `${slot.offsetTop + item.overlayY}px`;
      }

      function updateHomeLayout() {
        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const stageHeight = productList.offsetHeight + loadSentinel.offsetHeight + DESIGN.footerHeight;

        homeStage.style.left = `${(viewportWidth - DESIGN.width) / 2}px`;
        homeStage.style.transform = 'none';
        homeStage.style.height = `${stageHeight}px`;
        homeShell.style.height = `${stageHeight}px`;

        if (infoCard.classList.contains('is-open') && selectedTrigger) {
          positionInfoCard(Number(selectedTrigger.dataset.product), selectedTrigger);
        }
      }

      function openInfo(index, trigger) {
        const item = productAt(index);
        selectedTrigger = trigger;

        infoText.textContent = `Clipart ID: ${item.id}\nPrice: KR 1,000 WON`;
        copyright.textContent = item.owner;
        positionInfoCard(index, trigger);
        infoCard.classList.add('is-open');
      }

      function closeInfo({ restoreFocus = false } = {}) {
        infoCard.classList.remove('is-open');
        if (restoreFocus && selectedTrigger) selectedTrigger.focus({ preventScroll: true });
      }

      function setView(name) {
        const checkout = name === 'checkout';
        closeInfo();
        homeView.classList.toggle('is-active', !checkout);
        checkoutView.classList.toggle('is-active', checkout);
        history.replaceState(null, '', checkout ? '#checkout' : '#home');
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      productList.addEventListener('click', (event) => {
        const button = event.target.closest('.product');
        if (!button) return;

        const touchMode = window.matchMedia('(hover: none), (pointer: coarse)').matches;
        if (!touchMode) {
          openInfo(Number(button.dataset.product), button);
          return;
        }

        if (touchPreviewButton === button) {
          openInfo(Number(button.dataset.product), button);
          return;
        }

        if (touchPreviewButton) touchPreviewButton.classList.remove('is-touch-preview');
        touchPreviewButton = button;
        button.classList.add('is-touch-preview');
      });

      buyButton.addEventListener('click', () => setView('checkout'));
      backButton.addEventListener('click', () => setView('home'));

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && infoCard.classList.contains('is-open')) {
          closeInfo({ restoreFocus: true });
        }
      });

      document.addEventListener('pointerdown', (event) => {
        if (!infoCard.classList.contains('is-open')) return;
        if (infoCard.contains(event.target) || event.target.closest('.product')) return;
        closeInfo();
      });

      if ('IntersectionObserver' in window) {
        loadObserver = new IntersectionObserver((entries) => {
          if (entries.some((entry) => entry.isIntersecting)) renderMore();
        }, { rootMargin: '420px 0px' });
        loadObserver.observe(loadSentinel);
      }

      window.addEventListener('resize', scheduleHomeLayout, { passive: true });
      window.addEventListener('hashchange', () => {
        setView(location.hash === '#checkout' ? 'checkout' : 'home');
      });

      renderMore(INITIAL_BATCH);
      if (!loadObserver) renderMore(MAX_PRODUCTS);
      flushHomeLayout();
      setView(location.hash === '#checkout' ? 'checkout' : 'home');
    })();
  </script>
</body>
</html>
